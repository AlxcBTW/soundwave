# A full release, started by hand (Actions › Release › Run workflow). It checks main, raises the
# version, tags it, builds and signs the desktop app for Windows, macOS and Linux, publishes the
# release with the updater's latest.json (installed apps update to it), and deploys the website to
# GitHub Pages. The website is only ever deployed from a release.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if
# the key has one): the private half of the key whose public half is in src-tauri/tauri.conf.json.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: Or an exact version (e.g. 1.0.0); overrides the bump
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Version, tag and draft
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          current=$(node -p "require('./package.json').version")
          IFS=. read -r major minor patch <<< "${current%%-*}"
          if [ -n "$EXACT" ]; then version="${EXACT#v}"
          elif [ "$BUMP" = major ]; then version="$((major + 1)).0.0"
          elif [ "$BUMP" = minor ]; then version="${major}.$((minor + 1)).0"
          else version="${major}.${minor}.$((patch + 1))"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::$version is not a release version (x.y.z)"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then echo "::error::v$version exists already"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit the version and tag it
        run: |
          node scripts/set-version.mjs "${{ steps.v.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${{ steps.v.outputs.version }} [skip ci]"
          git tag "v${{ steps.v.outputs.version }}"
          git push origin HEAD:main "v${{ steps.v.outputs.version }}"
      - id: draft
        name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" --draft --verify-tag --generate-notes --title "Soundwave ${{ steps.v.outputs.version }}"
          echo "id=$(gh release view "v${{ steps.v.outputs.version }}" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: ./.github/actions/setup-build
        with:
          os: ${{ matrix.os }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The Discord application the profile status belongs to (src-tauri/src/discord.rs); unset = no status.
          SOUNDWAVE_DISCORD_CLIENT_ID: ${{ vars.SOUNDWAVE_DISCORD_CLIENT_ID }}
        with:
          tauriScript: pnpm tauri
          # Release builds also make the signed update bundles the installed apps download.
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          releaseId: ${{ needs.prepare.outputs.release_id }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  publish:
    name: Publish the release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --draft=false --latest

  website:
    name: Deploy the website
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v6
        id: pages
      - run: pnpm build
        env:
          # The site lives under /<repository>/ on github.io.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deploy
