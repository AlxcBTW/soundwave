# Keeps dependencies current: one grouped pull request per ecosystem each week.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # @spotify/basic-pitch is built on TensorFlow.js 3: a newer major beside it installs a second
      # TensorFlow, and the model it is handed no longer fits it (two backends, two tensor types).
      - dependency-name: '@tensorflow/tfjs'
        update-types: ['version-update:semver-major']
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
