<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150d3d"/>
      <stop offset="1" stop-color="#2b1a6b"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe6ff"/>
    </radialGradient>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#ground)"/>
  <g clip-path="url(#tile)" fill="none" stroke-linecap="round">
    <!-- the stage: a moon inside three nested arches -->
    <circle cx="512" cy="650" r="150" fill="url(#moon)"/>
    <path d="M 282 800 V 650 A 230 230 0 0 1 742 650 V 800" stroke="#33e7ff" stroke-width="56"/>
    <path d="M 192 800 V 650 A 320 320 0 0 1 832 650 V 800" stroke="#9a5cff" stroke-width="56"/>
    <path d="M 102 800 V 650 A 410 410 0 0 1 922 650 V 800" stroke="#ff2e8b" stroke-width="56"/>
    <!-- the deck -->
    <rect x="64" y="800" width="896" height="160" fill="#0a0720" stroke="none"/>
    <path d="M 150 842 H 874" stroke="#f5f2ff" stroke-width="14" opacity="0.9"/>
  </g>
</svg>
